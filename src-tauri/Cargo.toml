[package]
name = "np3-lab-desktop"
version = "0.7.0"
description = "High-performance native desktop shell for NP3 Lab"
authors = ["Min Jun (MJ-best)"]
edition = "2021"

[lib]
name = "np3_lab_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
tauri = { version = "2.0", features = ["tray-icon"] }
np3-core = { path = "../crates/np3-core" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
trash = "5.0"
chrono = "0.4"
walkdir = "2.5"
open = "5.3"
dirs = "5.0"
