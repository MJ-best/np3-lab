[package]
name = "np3-core"
version = "0.1.0"
edition = "2021"
description = "Core library for Nikon Z Picture Controls (.NP3, .NCP), RAW previews, and EXIF parsing"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
wasm-bindgen = "0.2"
js-sys = "0.3"
thiserror = "1.0"
unicode-normalization = "0.1"

[dev-dependencies]
wasm-bindgen-test = "0.3"
